<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- 타일 배경 그라데이션 -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>

    <!-- 글자 발광 효과 -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- 포인트 하이라이트 글자 그라데이션 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- 포인트 악센트 그라데이션 ('인' 또는 '세') -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- 메인 아이콘 바디 (iOS/모던 스쿼클 스타일) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />

  <!-- 3x2 그리드 타일 베이스 (세 / 컨 / 드 / 브 / 레 / 인) -->
  <g opacity="0.85">
    <!-- Row 1 -->
    <rect x="76" y="86" width="104" height="150" rx="18" fill="url(#tileGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />
    <rect x="204" y="86" width="104" height="150" rx="18" fill="url(#tileGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />
    <rect x="332" y="86" width="104" height="150" rx="18" fill="url(#tileGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

    <!-- Row 2 -->
    <rect x="76" y="276" width="104" height="150" rx="18" fill="url(#tileGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />
    <rect x="204" y="276" width="104" height="150" rx="18" fill="url(#tileGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />
    <rect x="332" y="276" width="104" height="150" rx="18" fill="url(#tileGrad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />
  </g>

  <!-- 3x2 그리드를 연결하는 미세한 시냅스 노드 선 -->
  <g stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4">
    <line x1="180" y1="161" x2="204" y2="161" />
    <line x1="308" y1="161" x2="332" y2="161" />
    <line x1="180" y1="351" x2="204" y2="351" />
    <line x1="308" y1="351" x2="332" y2="351" />
    <line x1="128" y1="236" x2="128" y2="276" />
    <line x1="256" y1="236" x2="256" y2="276" />
    <line x1="384" y1="236" x2="384" y2="276" />
  </g>

  <!-- 세컨드 브레인 한글 타이포그래피 (3x2 배열) -->
  <g font-family="'Pretendard', 'Apple SD Gothic Neo', -apple-system, sans-serif" 
     font-weight="900" 
     font-size="82" 
     text-anchor="middle" 
     dominant-baseline="central" 
     filter="url(#subtleGlow)">
    
    <!-- 1행: 세 컨 드 -->
    <text x="128" y="161" fill="url(#textGrad)">세</text>
    <text x="256" y="161" fill="url(#textGrad)">컨</text>
    <text x="384" y="161" fill="url(#textGrad)">드</text>

    <!-- 2행: 브 레 인 -->
    <text x="128" y="351" fill="url(#textGrad)">브</text>
    <text x="256" y="351" fill="url(#textGrad)">레</text>
    <text x="384" y="351" fill="url(#accentGrad)">인</text>
  </g>

  <!-- 우측 하단 '인' 글자 상단에 지성을 상징하는 반짝이는 스파크 닷 -->
  <circle cx="418" cy="305" r="5" fill="#38BDF8" />
  <circle cx="418" cy="305" r="9" fill="#38BDF8" fill-opacity="0.3" />
</svg>
